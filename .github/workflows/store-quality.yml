name: Store quality
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - name: Widget, contract and native Rive tests
        shell: pwsh
        run: ./tool/test-store.ps1
      - name: Visual failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: store-visual-failures
          path: test/widgets/failures
          if-no-files-found: ignore
  apk:
    if: github.event_name == 'workflow_dispatch'
    needs: flutter
    runs-on: windows-latest
    env:
      STORE_SIGNING_KEY_ALIAS: ${{ secrets.STORE_SIGNING_KEY_ALIAS }}
      STORE_SIGNING_KEY_PASSWORD: ${{ secrets.STORE_SIGNING_KEY_PASSWORD }}
      STORE_SIGNING_STORE_PASSWORD: ${{ secrets.STORE_SIGNING_STORE_PASSWORD }}
      STORE_SIGNING_KEYSTORE_BASE64: ${{ secrets.STORE_SIGNING_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true
      - name: Restore signing key in runner temporary storage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:STORE_SIGNING_KEYSTORE_BASE64 -or -not $env:STORE_SIGNING_KEY_ALIAS -or -not $env:STORE_SIGNING_KEY_PASSWORD -or -not $env:STORE_SIGNING_STORE_PASSWORD) { throw 'Configure all STORE_SIGNING secrets before building a release.' }
          $keyPath = Join-Path $env:RUNNER_TEMP 'store-upload.jks'
          [IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:STORE_SIGNING_KEYSTORE_BASE64))
          "STORE_SIGNING_STORE_FILE=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: store-release-apks
          path: build/app/outputs/flutter-apk/*-release.apk
